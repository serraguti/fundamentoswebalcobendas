<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function mostrarFavoritos() {
            //debemos buscar todos los input
            let checkbox = document.getElementsByTagName("input");
            //variable para guardar el contenido de los checkbox
            let contenido = "";
            for (let chk of checkbox){
                if (chk.checked){
                    //Tenemos los chequeados
                    //almacenamos el valor dentro del contenido
                    contenido += chk.value + ", ";
                }
            }
            //recuperamos el titulo resultado
            let resultado = document.getElementById("resultado");
            //dibujamos el contenido en el resultado
            resultado.innerText = contenido;
        }
    </script>
</head>
<body>
    <h1>Deportes favoritos</h1>
    <button onclick="mostrarFavoritos()">Ver favoritos</button>
    <br/>
    <input type="checkbox" value="Futbol"/>Futbol<br/>
    <input type="checkbox" value="Petanca"/>Petanca<br/>
    <input type="checkbox" value="Dardos"/>Dardos<br/>
    <input type="checkbox" value="Curling"/>Curling<br/>
    <h2 id="resultado"></h2>
</body>
</html>
