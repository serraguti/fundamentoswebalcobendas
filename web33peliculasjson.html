<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        async function cargarPeliculas() {
            let path = "documents/cine.json";
            //HACEMOS UNA PETICION AL SERVIDOR
            let response = await fetch(path);
            //CONVERTIMOS LOS DATOS DE LA RESPUESTA A JSON
            let datos = await response.json();
            console.log(datos);
            let contenido = "";
            //RECORREMOS LOS DATOS DE PELICULAS
            for (let peli of datos.Peliculas){
                //RELLENAMOS EL select CON <option> Y EL titulo de pelicula
                contenido += `
                    <option> ${peli.Titulo} </option>
                `
            }
            //BUSCAMOS EL select EN HTML
            let select = document.getElementById("selectpelicula");
            //DIBUJAMOS EL CONTENIDO DENTRO DEL SELECT
            select.innerHTML = contenido;
        }

        async function buscarPelicula() {
            let path = "documents/cine.json";
            let response = await fetch(path);
            let datos = await response.json();
            //NECESITAMOS EL VALOR DE LA PELICULA SELECCIONADA
            //RECUPERAMOS EL select DEL HTML
            let select = document.getElementById("selectpelicula");
            //RECUPERAMOS EL NOMBRE DE LA PELICULA
            let nombrepeli = select.value;
            //DEBEMOS RECORRER TODAS LAS PELICULAS Y COMPARAR 
            //EL TITULO QUE RECORREMOS CON nombrepeli
            for (let peli of datos.Peliculas){
                if (peli.Titulo == nombrepeli){
                    //TENEMOS LA PELICULA SELECCIONADA
                    //BUSCAMOS RESULTADO DENTRO DE HTML
                    let resultado = document.getElementById("resultado");
                    //PINTAMOS EL Argumento
                    resultado.innerHTML = `
                        <p>${peli.Argumento}</p>
                        <p> Género: ${peli.Genero} </p>
                        <p> Duración: ${peli.Duracion} </p>
<iframe width="560" height="315" src="https://www.youtube.com/embed/Stz1AF0SHgI?si=m0W2O41mT896A0pI" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>                        
                    `
                }
            }
        }
    </script>
</head>
<body>
    <h1>Peliculas JSON</h1>
    <button onclick="cargarPeliculas()">Cargar peliculas</button>
    Seleccione película
    <select id="selectpelicula"></select>
    <button onclick="buscarPelicula()">Buscar pelicula</button>
    <div id="resultado">
    </div>

</body>
</html>
