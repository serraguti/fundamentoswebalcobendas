<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function mostrarMascotas() {
            //queremos un conjunto de mascotas (array)
            let arraymascotas = [];            
            //creamos una nueva mascota
            let gato = new Object();
            gato.nombre = "Garfield";
            gato.raza = "Gato";
            gato.edad = 41;
            let perro = new Object();
            perro.nombre = "Slinky";
            perro.raza = "Perro";
            perro.edad = 10;
            //guardamos nuestras mascotas en el array
            arraymascotas.push(gato);
            arraymascotas.push(perro);
            //recorremos todas nuestras mascotas
            //y las escribimos en un contenido html
            let contenido = "";
            for (let mascota of arraymascotas){
                contenido += "<li>" + mascota.nombre + "</li>";
            }
            //buscamos la lista llamada resultado
            let resultado = document.getElementById("resultado");
            //dibujamos el contenido HTML
            resultado.innerHTML = contenido;
            //queremos dibujar las mascotas en una tabla html
            //declaramos una variable para el dibujo de cada fila
            let filas = "";
            //recorremos todas las mascotas
            for (let mascota of arraymascotas){
                //dibujamos las filas de la tabla
                filas += "<tr>"; //abrimos fila
                //creamos cada columna
                filas += "<td>" + mascota.nombre + "</td>"; //columna nombre
                filas += "<td>" + mascota.raza + "</td>"; //columna raza
                filas += "<td>" + mascota.edad + "</td>"; // columna edad
                filas += "</tr>"; //cerramos fila
            }
            //buscamos la tabla de las mascotas
            let tabla = document.getElementById("tablamascotas");
            //dibujamos las filas en la tabla
            tabla.innerHTML = filas;
        }
    </script>
</head>
<body>
    <h1>Conjunto de mascotas</h1>
    <button onclick="mostrarMascotas()">Mostrar mascotas</button>
    <ul id="resultado">
    </ul>
    <table border="1" id="tablamascotas"></table>
    <table border="1">
        <tr>
            <td> Garfield </td>
            <td> Gato gordo </td>
            <td> 41 </td>
        </tr>
        <tr>
            <td> Slinky </td>
            <td> Perro muelle </td>
            <td> 14 </td>
        </tr>
    </table>
</body>
</html>
