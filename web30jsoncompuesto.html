<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        async function leerJsonClientes(){
            let path = "documents/clientes.json";
            //realizamos una peticion 
            let response = await fetch(path);
            //convertimos a json los datos de la respuesta
            let datos = await response.json();
            console.log(datos);
            //necesitamos un contenido html para el dibujo
            let contenido = "";
            //viene un conjunto de clientes
            //recorremos cada cliente de los datos
            for (let cliente of datos){
                //dibujamos el nombre de cada cliente en la lista
                contenido += "<li>" + cliente.nombre + "</li>";
            }
            //buscamos la lista de clientes en html
            let lista = document.getElementById("listaclientes");
            //dibujamos el contenido en la lista
            lista.innerHTML = contenido;
        }
    </script>
</head>
<body>
    <h1>Lectura JSON clientes</h1>
    <button onclick="leerJsonClientes()">Leer json clientes</button>
    <ul id="listaclientes"></ul>
</body>
</html>
