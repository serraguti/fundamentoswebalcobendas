<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let url = "https://apicruddepartamentoscore.azurewebsites.net/";
        async function cargarDepartamentos() {
            let request = url + "api/departamentos";
            //realizamos la peticion al servidor
            let response = await fetch(request);
            //convertimos los datos a json
            let datos = await response.json();
            //filas para la tabla
            let filas = "";
            for (let departamento of datos){
                //hacemos el dibujo de las filas de la tabla
                filas += `
                    <tr>
                        <td>${departamento.numero}</td>
                        <td>${departamento.nombre}</td>
                        <td>${departamento.localidad}</td>
                    </tr>
                `
            }
            //buscamos la tabla en html
            let tabla = document.getElementById("tabladepartamentos")
            tabla.innerHTML = filas;
        }

        async function eliminarDepartamento() {
            //recuperamos la cajaid de html
            let cajaid = document.getElementById("cajaid");
            //recuperamos el valor del id de la caja
            let id = cajaid.value;
            //construimos la peticion
            let request = url + "api/departamentos/" + id;
            //realizamos la petición al servidor con delete
            let response = await fetch(request, {
                "method": "DELETE"
            })
            cargarDepartamentos();
        }
    </script>
</head>
<body>
    <h1>Departamentos</h1>
    Id departamento: <input type="number" id="cajaid"/>
    <button onclick="eliminarDepartamento()">Eliminar departamento</button>
    <br/>
    <button onclick="cargarDepartamentos()">Cargar departamentos</button>
    <table border="1" id="tabladepartamentos"></table>
</body>
</html>
