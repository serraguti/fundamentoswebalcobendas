<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function calcularDia(){
            let dia = parseInt(document.getElementById("cajadia").value)
            let mes = parseInt(document.getElementById("cajadia").value)
            let anyo = parseInt(document.getElementById("cajaanyo").value)
            //hacemos el calculo dependiendo del mes
            if (mes == 1){
                mes = 13;
                anyo = anyo - 1;
            }else if (mes == 2){
                mes = 14;
                anyo--;
            }
            //Multiplicar el Mes más 1 por 3 y dividirlo entre 5
            let op1 = (mes + 1) * 3 / 5;
            //Dividir el año entre 4
            let op2 = anyo / 4;
            //Dividir el año entre 100
            let op3 = anyo / 100;
            //Dividir el año entre 400
            let op4 = anyo / 400;
            //Sumar el dia, el doble del mes, el año
            // , el resultado de la operación 1, 
            // el resultado de la operación 2, 
            // menos el resultado de la operación 3 
            // más la operación 4 más 2.
            let op5 = dia + (mes * 2) + anyo + op1 + op2 - op3 + op4 + 2;
            //Dividir el resultado anterior entre 7
            let op6 = op5 / 7;
            //Restar el número del paso 5 con el número del paso 6 por 7.
            let resultado = op5 - (op6 * 7);
            let diasemana = "";
            if (resultado == 0){
                diasemana = "SABADO";
            }else if (resultado == 1){
                diasemana = "DOMINGO";
            }else if (resultado == 2){
                diasemana == "LUNES";
            }else if (resultado == 3){
                diasemana == "MARTES";
            }else if (resultado == 4){
                diasemana == "MIERCOLES";
            }else if (resultado == 5){
                diasemana == "JUEVES";
            }else if (resultado == 6){
                diasemana == "VIERNES";
            }
            let mensaje = document.getElementById("mensaje");
            mensaje.innerText = "El dia es " + diasemana;
        }
    </script>
</head>
<body>
    <h1>Día de la semana</h1>
    Día <input type="text" id="cajadia"/><br/>
    Mes: <input type="number" id="cajames"/><br/>
    Año: <input type="number" id="cajaanyo"/><br/>
    <button onclick="calcularDia()">Calcular día semana</button>
    <h3 id="mensaje"></h3>
</body>
</html>
