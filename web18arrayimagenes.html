<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function cambiarImagen() {
            //debemos recuperar un array con todas las imagenes
            let imagenes = document.getElementsByTagName("img");
            //recorremos todas las imagenes, empezando en cero y 
            //terminando en length - 1
            // for (let i = 0; i < imagenes.length; i++){
            //     //almacenamos cada img en una variable
            //     //con la que estamos recorriendo
            //     let img = imagenes[i];
            //     //modificamos la imagen
            //     img.src = "images/02.jpg";
            // }
            for (let img of imagenes){
                img.src = "images/02.jpg";
            }
        }
    </script>
    <style>
        img {
            width: 100px; height: 100px;
        }
    </style>
</head>
<body>
    <h1>Array imágenes</h1>
    <button onclick="cambiarImagen()">Cambiar imagen</button>
    <img src="images/01.avif"/><img src="images/01.avif"/>
    <img src="images/01.avif"/><img src="images/01.avif"/>
</body>
</html>
